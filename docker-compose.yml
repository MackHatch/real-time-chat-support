version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: support-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_chat
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: support-chat-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: support-chat-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./ops/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - '4318:4318' # OTLP HTTP receiver
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: support-chat-jaeger
    restart: unless-stopped
    ports:
      - '16686:16686' # Jaeger UI
      - '14250:14250' # gRPC ingest
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:

